<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WayIQ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #fff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* ---------- Loader ---------- */
        /* ---------- Loader (sized to match the WayIQ page loader) ---------- */
        :root {
            --spinner-size: 60px;
            /* was 44px */
            --spinner-thickness: 4px;
            /* was 3px */
            --loader-font: 17px;
            /* was 15px */
            --loader-gap: 24px;
            /* was 18px */
        }

        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--loader-gap);
            background: #fff;
        }

        .spinner {
            width: var(--spinner-size);
            height: var(--spinner-size);
            border: var(--spinner-thickness) solid transparent;
            border-top-color: #b565b0;
            border-left-color: #b565b0;
            border-radius: 50%;
            animation: wqspin 0.9s linear infinite;
        }

        .loader-text {
            color: #9a9aa5;
            font-size: var(--loader-font);
        }

        @keyframes wqspin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Error ---------- */
        #loader.err .spinner {
            display: none;
        }

        #loader.err .loader-text {
            color: #b00020;
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Hold tight. Good data takes time.</div>
    </div>

    <script>
        (() => {
            if (window.__wqLoaded) return;          // ignore duplicate copies of this script
            window.__wqLoaded = true;

            const TOKEN_API = "https://wayiq-custompage.onrender.com/api/ghl/sso";

            // Use ONE of these two:
            const WAYIQ_API = "https://wayiq-custompage.onrender.com/api/wayiq/auth";              // via Render (no CORS problem)
            // const WAYIQ_API = "https://api-wayiq.dev.purplescape.com/api/purpl-home/auth/ghl";  // direct (needs CORS on WayIQ)

            const ALLOWED_REDIRECT_HOSTS = ["wayiq.dev.purplescape.com"];

            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loaderText");
            let handled = false;

            function fail(text) {
                loader.classList.add("err");
                loaderText.textContent = text;
            }

            function findUrl(j) {
                const c = [j?.redirectUrl, j?.url, j?.pageUrl, j?.data?.redirectUrl, j?.data?.url];
                return c.find((v) => typeof v === "string" && /^https?:\/\//.test(v));
            }

            // Load the page in a full-size frame; keep the loader visible until it has loaded
            function openFrame(url) {
                const frame = document.createElement("iframe");
                frame.src = url;
                frame.style.cssText =
                    "position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0";
                frame.setAttribute("allow", "clipboard-write");

                let shown = false;
                const reveal = () => {
                    if (shown) return;
                    shown = true;
                    frame.style.opacity = "1";
                    loader.remove();
                };
                frame.addEventListener("load", reveal);
                setTimeout(reveal, 15000);          // safety: never keep the loader forever

                document.body.appendChild(frame);
            }

            async function post(url, body) {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 30000);
                try {
                    return await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                        signal: ctrl.signal,
                    });
                } finally {
                    clearTimeout(timer);
                }
            }

            window.addEventListener("message", async (e) => {
                if (e.source !== window.parent) return;
                if (e.data?.message !== "REQUEST_USER_DATA_RESPONSE") return;
                if (handled) return;
                handled = true;
                clearTimeout(waitTimer);

                try {
                    // 1) GHL payload -> token (Render)
                    const t = await post(TOKEN_API, { encrypted: e.data.payload });
                    if (!t.ok) return fail("Token service error " + t.status);
                    const { token } = await t.json();

                    // 2) Send the token as accessToken
                    const r = await post(WAYIQ_API, { accessToken: token });
                    if (!r.ok) return fail("WayIQ rejected the sign-in (" + r.status + ")");
                    const data = await r.json();

                    const url = findUrl(data);
                    if (!url) return fail("WayIQ did not return a page to open.");

                    // 3) Open the response page directly
                    const target = new URL(url);
                    if (target.protocol !== "https:" || !ALLOWED_REDIRECT_HOSTS.includes(target.hostname)) {
                        return fail("Unexpected redirect address.");
                    }
                    openFrame(target.toString());
                } catch (err) {
                    console.error(err);
                    fail(err.name === "AbortError"
                        ? "The request timed out. Please reload."
                        : "Something went wrong: " + err.message);
                }
            });

            // If GHL never answers, say so instead of spinning forever
            const waitTimer = setTimeout(() => {
                if (!handled) fail("No response from GHL. Open this page from the WayIQ sidebar icon.");
            }, 15000);

            window.parent.postMessage({ message: "REQUEST_USER_DATA" }, "*");
        })();
    </script>
</body>

</html>
