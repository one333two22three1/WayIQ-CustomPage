<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WayIQ sign-in</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: #fff;
            border: 1px solid #d9dde8;
            border-radius: 12px;
            padding: 28px 28px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .card h3 {
            margin: 0 0 16px;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
        }

        .muted {
            color: #777;
            font-size: 13px;
            margin: 12px 0 4px;
        }

        .err {
            color: #b00020;
        }

        .ok {
            color: #1b7f3b;
        }

        pre {
            background: #f4f5f8;
            border: 1px solid #e4e6ed;
            border-radius: 8px;
            padding: 12px 14px;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 12px;
            margin: 0 0 8px;
            line-height: 1.6;
        }

        button {
            background: #2d5bff;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            margin-top: 8px;
        }

        button:hover {
            background: #1a46e0;
        }

        button:disabled {
            opacity: .6;
            cursor: default;
        }
    </style>
</head>

<body>
    <div class="card" id="box">
        <h3 id="status">Waiting for GHL…</h3>
        <div id="details"></div>
    </div>

    <script>
        const TOKEN_API = "https://wayiq-custompage.onrender.com";
        const WAYIQ_API = "https://wayiq-custompage.onrender.com/wayiq";
        const DEFAULT_APP_URL = "https://wayhub.io";   // used if the server doesn't return appUrl
        const REQUIRE_CONTINUE = true;                 // true = verification screen + Continue; false = open straight away

        const statusEl = document.getElementById("status");
        const details = document.getElementById("details");

        let session = null;
        let appUrl = DEFAULT_APP_URL;                  // <- this was missing; it is set from the login response below
        let handled = false;

        function esc(s) {
            return String(s ?? "-").replace(/[&<>"']/g, (c) =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function decodeJwt(t) {
            const p = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
            return JSON.parse(decodeURIComponent(escape(atob(p))));
        }

        function fail(text) {
            statusEl.className = "err";
            statusEl.textContent = text;
        }

        // Open the wayhub.io page in an inner frame and hand it the session (postMessage, never in the URL)
        function openWayIQ() {
            const origin = new URL(appUrl).origin;

            window.addEventListener("message", (e) => {
                if (e.origin !== origin || e.data?.type !== "WAYIQ_READY") return;
                e.source.postMessage({ type: "WAYIQ_SESSION", session }, origin);
            });

            const frame = document.createElement("iframe");
            frame.src = appUrl;
            frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
            document.body.replaceChildren(frame);
        }

        window.addEventListener("message", async (e) => {
            if (e.source !== window.parent) return;
            if (e.data?.message !== "REQUEST_USER_DATA_RESPONSE") return;
            if (handled) return;
            handled = true;

            try {
                statusEl.textContent = "GHL data received";

                // Token service: GHL payload -> 60-second token
                const t = await fetch(TOKEN_API + "/api/ghl/sso", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ encrypted: e.data.payload }),
                });
                if (!t.ok) return fail("Token service error " + t.status);
                const { token } = await t.json();
                const claims = decodeJwt(token);

                // WayIQ: token in the Authorization header -> session + page to open
                const r = await fetch(WAYIQ_API + "/auth/ghl-login", {
                    method: "POST",
                    headers: { Authorization: "Bearer " + token },
                });
                if (!r.ok) {
                    let detail = "";
                    try { const b = await r.json(); detail = " - " + (b.reason || b.error); } catch (_) { }
                    return fail("WayIQ rejected the sign-in (" + r.status + ")" + detail);
                }
                const data = await r.json();
                session = data.session;
                appUrl = data.appUrl || DEFAULT_APP_URL;   // <- set here

                if (!REQUIRE_CONTINUE) return openWayIQ();

                statusEl.className = "ok";
                statusEl.textContent = "Verified. Review the details, then continue.";
                details.innerHTML =
                    "<p class='muted'>Token</p><pre>" + esc(token) + "</pre>" +
                    "<p class='muted'>Token claims</p><pre>" + esc(JSON.stringify(claims, null, 2)) + "</pre>";
                // "<p class='muted'>Opens</p><pre>" + esc(appUrl) + "</pre>" +
                // "<button id='go'>Continue to WayIQ</button>";

                // document.getElementById("go").onclick = (ev) => {
                //     ev.target.disabled = true;
                //     openWayIQ();
                // };
            } catch (err) {
                console.error(err);
                fail("Something went wrong: " + err.message);
            }
        });

        window.parent.postMessage({ message: "REQUEST_USER_DATA" }, "*");
    </script>
</body>

</html>
